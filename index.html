<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Filters Prototype</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #edf3f8;
      padding: 40px;
      margin: 0;
    }

    .wrapper {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      max-width: 1200px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
    }

    .filter-field label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #222;
    }

    .filter-field select,
    .filter-field input {
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
    }

    .filter-field button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #666;
      margin-top: 4px;
      align-self: flex-end;
    }

    .add {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .dropdown {
      position: relative;
    }

    .dropdown input {
      padding: 10px 12px;
      width: 300px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 14px;
    }

    .dd-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: none;
      z-index: 100;
    }

    .dd-list div {
      padding: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .dd-list div:hover {
      background-color: #f1f1f1;
    }

    .button {
      background-color: #6e936e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .clear {
      background: none;
      border: none;
      color: #333;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="filters" id="filter-fields"></div>
    <div class="add">
      <div class="dropdown">
        <input placeholder="+ Add filter field…" oninput="filterDD(this.value)" onclick="showDD()" />
        <div class="dd-list" id="dd"></div>
      </div>
      <button class="button" onclick="addFromInput()">Add</button>
      <button class="clear" onclick="clearAll()">Cancel</button>
    </div>
  </div>
<script>
  const availableFilters = [
    'Producer','Received Date','Due Date','City','State','Label','Completed','Group','Platform','Effective Date','Renewals','Production Date','Record Number','Status','Category','Reviewer'
  ];

  let sessionFilters = [];

  function renderFilters() {
    const container = document.getElementById('filter-fields');
    container.innerHTML = '';
    sessionFilters.forEach(f => {
      const field = document.createElement('div');
      field.className = 'filter-field';
      field.innerHTML = `
        <label>${f}</label>
        <select>
          <option value="">Select...</option>
          <option>Option 1</option>
          <option>Option 2</option>
          <option>Option 3</option>
        </select>
        <button onclick="removeFilter('${f}')">×</button>
      `;
      container.appendChild(field);
    });
  }

  function showDD() {
    filterDD('');
    document.getElementById('dd').style.display = 'block';
  }

  function filterDD(query) {
    const dd = document.getElementById('dd');
    dd.innerHTML = '';
    availableFilters.filter(f => f.toLowerCase().includes(query.toLowerCase()) && !sessionFilters.includes(f))
      .forEach(f => {
        const item = document.createElement('div');
        item.textContent = f;
        item.onclick = () => {
          sessionFilters.push(f);
          renderFilters();
          dd.style.display = 'none';
          document.querySelector('.dropdown input').value = '';
        };
        dd.appendChild(item);
      });
    dd.style.display = 'block';
  }

  function addFromInput() {
    const input = document.querySelector('.dropdown input');
    const value = input.value.trim();
    if (value && availableFilters.includes(value) && !sessionFilters.includes(value)) {
      sessionFilters.push(value);
      renderFilters();
    }
    input.value = '';
    document.getElementById('dd').style.display = 'none';
  }

  function removeFilter(name) {
    sessionFilters = sessionFilters.filter(f => f !== name);
    renderFilters();
  }

  function clearAll() {
    sessionFilters = [];
    renderFilters();
  }
</script>
</body>
</html>
